apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexbin-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nexbin-web
  template:
    metadata:
      labels:
        app: nexbin-web
    spec:
      containers:
        - name: nexbin-web
          image: ghcr.io/<owner>/nexbin:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
---
apiVersion: v1
kind: Service
metadata:
  name: nexbin-web
spec:
  type: ClusterIP
  selector:
    app: nexbin-web
  ports:
    - port: 80
      targetPort: 3000
